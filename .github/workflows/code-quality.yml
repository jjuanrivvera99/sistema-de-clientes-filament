name: Code Quality Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    # Using SQLite for testing (faster and simpler)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, dom, fileinfo, sqlite3, gd
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-composer-${{ hashFiles('composer.lock') }}
          restore-keys: dependencies-composer-

      - name: Setup environment and database
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Generate application key
        run: php artisan key:generate

      - name: Code Style Check (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Static Analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Setup Test Database and Migrations
        run: |
          php artisan shield:install --fresh --minimal
          php artisan migrate --force
          
      - name: Run Tests
        run: php artisan test --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Security Audit (Composer)
        run: composer audit

      - name: Check for outdated dependencies
        run: composer outdated --direct --strict || true

  deployment-check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, dom, fileinfo, sqlite3

      - name: Setup environment and database
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          echo "APP_ENV=production" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Check deployment readiness
        run: |
          echo "✅ Code quality checks passed"
          echo "✅ All tests passed"
          echo "✅ Static analysis passed"
          echo "✅ Code style check passed"
          echo "🚀 Ready for deployment"